title: gofindimpl
tagline: Find the Go structs that implement an interface
description: A Go command line tool that scans a module for structs that have a method for every method name of a given interface, and prints them as JSON.
lang: en
url: https://psyb0t.github.io
baseurl: /gofindimpl
repository: psyb0t/gofindimpl
author: Ciprian Mandache

